<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>การ์ดลูกชิ้น</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; background: #fff8e7; color: #2b2b2b; -webkit-tap-highlight-color: transparent; }
  h2 { margin: 0 0 8px; } h3 { margin: 20px 0 12px; font-size: 18px; }
  #login { padding-top: 40px; text-align: center; } #login p { color: #666; margin-bottom: 16px; } #login input { margin-bottom: 10px; } #login button { width: 100%; margin-top: 8px; }
  input { padding: 12px; font-size: 16px; width: 100%; border-radius: 10px; border: 1px solid #ddd; background: #fff; }
  input:focus { outline: 2px solid #fbbf24; outline-offset: 1px; border-color: #fbbf24; }
  button { padding: 12px 20px; font-size: 16px; font-weight: 600; border-radius: 10px; border: none; background: #ef4444; color: #fff; cursor: pointer; transition: transform .1s; }
  button:active:not(:disabled) { transform: scale(.97); } button:disabled { background: #d1d5db; cursor: not-allowed; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .header h2 { margin: 0; font-size: 22px; } .header .logout-btn { background: #9ca3af; padding: 8px 14px; font-size: 14px; font-weight: 500; }
  .points-box { background: linear-gradient(135deg, #fff7d6, #fef3c7); padding: 16px; border-radius: 14px; text-align: center; font-size: 20px; border: 1px solid #fde68a; }
  .points-box b { font-size: 24px; color: #b45309; }
  .open-wrap { text-align: center; margin: 16px 0; } #openBtn { width: 100%; padding: 14px; font-size: 17px; background: #ef4444; }
  #main { padding-bottom: 100px; }
  
  /* Tabs */
  .tabs { display: flex; background: #fff; border-radius: 12px; padding: 4px; margin: 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .tab { flex: 1; padding: 10px; text-align: center; font-size: 14px; font-weight: 600; color: #666; cursor: pointer; border-radius: 8px; transition: background .15s, color .15s; }
  .tab.active { background: #fbbf24; color: #fff; }
  .tab-content { display: none; } .tab-content.active { display: block; }
  
  /* Inventory Grid */
  #inventory { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  #inventory .empty, .empty { grid-column: 1 / -1; text-align: center; color: #999; padding: 20px; }
  .card { position: relative; aspect-ratio: 1/1; border-radius: 14px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; background: #fffdf7; border: 2px solid #e5e5e5; contain: layout style; user-select: none; transition: transform .08s; }
  .card:active { transform: scale(.97); }
  .card .art { flex: 1; display: grid; place-items: center; background-size: cover; background-position: center; background-repeat: no-repeat; min-height: 0; }
  .card .emoji { font-size: 40px; line-height: 1; text-shadow: 0 2px 4px rgba(0,0,0,.12); }
  .card .meta { background: rgba(255,255,255,.9); padding: 4px 6px 5px; text-align: center; border-top: 1px solid rgba(0,0,0,.05); }
  .card .name { font-size: 11px; font-weight: 600; color: #2b2b2b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
  .card .power { font-size: 10px; color: #b45309; margin-top: 1px; line-height: 1.2; }
  .rarity-common { border-color: #d1d5db; } .rarity-rare { border-color: #3b82f6; } .rarity-epic { border-color: #a855f7; } .rarity-legendary { border-color: #eab308; box-shadow: 0 0 10px rgba(234,179,8,.45); }
  .rarity-common .art { background: linear-gradient(135deg, #f9fafb, #f3f4f6); } .rarity-rare .art { background: linear-gradient(135deg, #eff6ff, #dbeafe); } .rarity-epic .art { background: linear-gradient(135deg, #faf5ff, #f3e8ff); } .rarity-legendary .art { background: linear-gradient(135deg, #fefce8, #fef3c7); }
  .card.selected { border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,.25); }
  .card.rarity-legendary.selected { box-shadow: 0 0 0 3px rgba(22,163,74,.25), 0 0 10px rgba(234,179,8,.45); }
  .card .badge { position: absolute; top: 6px; right: 6px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: #16a34a; color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,.25); transform: scale(0); opacity: 0; transition: transform .15s ease, opacity .15s ease; }
  .card.selected .badge { transform: scale(1); opacity: 1; }
  
  /* Select bar */
  .select-bar { position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 120%); width: 100%; max-width: 480px; background: #fff; box-shadow: 0 -4px 16px rgba(0,0,0,.12); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; align-items: center; gap: 12px; z-index: 50; transition: transform .25s ease; }
  .select-bar.show { transform: translate(-50%, 0); }
  .select-info { font-size: 13px; color: #555; line-height: 1.35; flex: 1; min-width: 0; } .select-info b { color: #16a34a; font-size: 15px; }
  .select-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .select-actions .btn-ghost { background: #f3f4f6; color: #374151; padding: 10px 14px; font-size: 14px; font-weight: 500; }
  .select-actions #redeemBtn { background: #16a34a; padding: 10px 16px; font-size: 14px; }
  
  /* Coupons */
  .coupon { background: #fff; border: 2px dashed #16a34a; border-radius: 12px; padding: 14px; margin: 10px 0; text-align: center; }
  .coupon .code { font-size: 28px; font-weight: bold; letter-spacing: 4px; color: #16a34a; margin: 4px 0; font-family: ui-monospace, SFMono-Regular, monospace; }
  .coupon .meta { font-size: 12px; color: #666; } .coupon .count { font-weight: 600; }
  .coupon .label { font-size: 15px; font-weight: 700; color: #16a34a; margin: 6px 0; }
  
  /* Collection */
  .set-card { background: #fff; border-radius: 14px; padding: 14px; margin: 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,.06); border: 2px solid #e5e5e5; }
  .set-card.complete { border-color: #eab308; box-shadow: 0 0 12px rgba(234,179,8,.3); }
  .set-card.ultimate { background: linear-gradient(135deg, #fefce8, #fff7d6); border-color: #eab308; box-shadow: 0 4px 12px rgba(234,179,8,.35); }
  .set-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .set-title { font-weight: 700; font-size: 16px; } .set-progress-text { font-size: 14px; color: #666; font-weight: 600; }
  .progress-bar { height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; margin: 6px 0 12px; }
  .progress-fill { height: 100%; background: #16a34a; border-radius: 4px; transition: width .3s; }
  .set-cards { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 12px; }
  .set-card-mini { aspect-ratio: 1/1; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 22px; position: relative; border: 2px solid #e5e5e5; background: #f9fafb; }
  .set-card-mini.owned { background: #fff; }
  .set-card-mini.rarity-common { border-color: #d1d5db; } .set-card-mini.rarity-rare { border-color: #3b82f6; } .set-card-mini.rarity-epic { border-color: #a855f7; } .set-card-mini.rarity-legendary { border-color: #eab308; }
  .set-card-mini.missing { color: #d1d5db; background: #f3f4f6; }
  .set-card-mini .count-badge { position: absolute; top: 2px; right: 2px; background: #16a34a; color: #fff; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 8px; min-width: 16px; text-align: center; }
  .set-card-mini .used-mark { position: absolute; bottom: 2px; right: 2px; font-size: 12px; color: #16a34a; font-weight: 700; }
  .set-reward { background: #fef3c7; border-radius: 8px; padding: 8px 10px; font-size: 13px; color: #92400e; margin-bottom: 10px; text-align: center; }
  .set-reward.claimed { background: #f3f4f6; color: #6b7280; }
  .set-action-btn { width: 100%; padding: 12px; font-size: 15px; }
  .set-action-btn.claim { background: #16a34a; } .set-action-btn.claimed { background: #d1d5db; }

  /* Reroll FAB */
  #rerollFab { position: fixed; bottom: 90px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: #a855f7; color: #fff; border: none; font-size: 24px; cursor: pointer; box-shadow: 0 4px 12px rgba(168,85,247,.4); z-index: 40; display: none; align-items: center; justify-content: center; padding: 0; }
  #rerollFab.show { display: flex; }
  
  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 60; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal-box { background: #fff; border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; max-height: 80vh; overflow-y: auto; }
  .modal-box h3 { margin-top: 0; }
  .reroll-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .reroll-item { aspect-ratio: 1/1; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: 3px solid transparent; position: relative; padding: 4px; }
  .reroll-item.selected { border-color: #a855f7; }
  .reroll-item .emoji { font-size: 28px; } .reroll-item .name { font-size: 9px; margin-top: 2px; text-align: center; }
  .reroll-item .count-badge { position: absolute; top: 2px; right: 2px; background: #16a34a; color: #fff; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 8px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 12px; } .modal-actions button { flex: 1; }

  /* Toast */
  #toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); background: #333; color: #fff; padding: 10px 20px; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 100; max-width: 90%; text-align: center; font-size: 14px; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <div id="login">
    <h2>🍡 การ์ดลูกชิ้น</h2>
    <p>ใส่เบอร์โทรและ PIN 4 หลัก</p>
    <input id="phone" placeholder="0812345678" inputmode="numeric">
    <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="PIN 4 หลัก">
    <button onclick="login()">เข้า</button>
  </div>

  <div id="main" style="display:none">
    <div class="header">
      <h2>สวัสดี 👋</h2>
      <button class="logout-btn" onclick="logout()">ออก</button>
    </div>
    <div class="points-box">⭐ แต้ม: <b id="points">0</b></div>
    <div class="open-wrap">
      <button onclick="openPack()" id="openBtn">🎴 เปิดการ์ด (1 แต้ม)</button>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="inv">การ์ด</div>
      <div class="tab" data-tab="col">📖 สมุด</div>
      <div class="tab" data-tab="cp">🎟️ คูปอง</div>
    </div>

    <div id="tab-inv" class="tab-content active">
      <h3>การ์ดของฉัน (<span id="invCount">0</span> ใบ)</h3>
      <div id="inventory"></div>
    </div>

    <div id="tab-col" class="tab-content">
      <div id="collection"></div>
    </div>

    <div id="tab-cp" class="tab-content">
      <h3>🎟️ คูปองของฉัน (<span id="cpCount">0</span>)</h3>
      <div id="coupons"></div>
    </div>
  </div>
</div>

<div id="selectBar" class="select-bar">
  <div class="select-info" id="selInfo">เลือกแล้ว 0/5 ใบ</div>
  <div class="select-actions">
    <button class="btn-ghost" onclick="clearSelection()">ยกเลิก</button>
    <button id="redeemBtn" onclick="redeemCards()" disabled>🎟️ แลก</button>
  </div>
</div>

<button id="rerollFab" onclick="openRerollModal()">🔀</button>

<div id="rerollModal" class="modal-overlay">
  <div class="modal-box">
    <h3>🔀 Reroll การ์ดซ้ำ</h3>
    <p style="font-size:13px;color:#666;margin-top:0">เลือกการ์ดซ้ำ 1 ใบ → สุ่มใหม่ (odds เท่ากล่องปกติ)<br>ทุก 6 ชม. · สูงสุด 4 ครั้ง/วัน</p>
    <div id="rerollList" class="reroll-list"></div>
    <div class="modal-actions">
      <button class="btn-ghost" style="background:#f3f4f6;color:#374151" onclick="closeRerollModal()">ปิด</button>
      <button id="rerollConfirm" style="background:#a855f7" onclick="doReroll()" disabled>ยืนยัน</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://xhnxrboydlevjeqworyi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ecRbr3bPB9ldZEGss8xsFw_P5VAvCYy';
const POINTS_PER_PACK = 1;
const CARDS_PER_SAUSAGE = 5;

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
let me = null;
let pin = '';
let collection = null;
const selectedIds = new Set();
let selectedReroll = null;

const inventoryEl = document.getElementById('inventory');
const collectionEl = document.getElementById('collection');
const toastEl = document.getElementById('toast');

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

// Tabs
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('tab-' + t.dataset.tab).classList.add('active');
    if (t.dataset.tab === 'col' && !collection) loadCollection();
    updateRerollFab();
  });
});

// Auth
window.login = async () => {
  const phone = document.getElementById('phone').value.trim();
  if (!/^0\d{9}$/.test(phone)) return toast('เบอร์ไม่ถูกต้อง');
  pin = document.getElementById('pin').value.trim();
  if (!/^\d{4}$/.test(pin)) return toast('PIN ต้องเป็นเลข 4 หลัก');
  const { data, error } = await sb.rpc('rpc_get_customer', { p_phone: phone, p_pin: pin });
  if (error) return toast('ผิดพลาด: ' + error.message);
  if (!data.ok) {
    return toast(data.error === 'locked' ? 'ใส่ PIN ผิดหลายครั้ง รอ 15 นาที' : 'เบอร์หรือ PIN ไม่ถูกต้อง');
  }
  localStorage.setItem('phone', phone);
  localStorage.setItem('pin', pin);
  me = data;
  selectedIds.clear();
  if (me.is_new) setTimeout(() => toast('🎉 ยินดีต้อนรับ! รับ 3 แต้มฟรี'), 300);
  render();
};

window.logout = () => {
  localStorage.removeItem('phone');
  localStorage.removeItem('pin');
  location.reload();
};

window.openPack = async () => {
  if (me.points < POINTS_PER_PACK) return toast('แต้มไม่พอ');
  const btn = document.getElementById('openBtn');
  btn.disabled = true;
  const { data, error } = await sb.rpc('rpc_open_pack', { p_phone: me.phone, p_pin: pin });
  btn.disabled = me.points < POINTS_PER_PACK;
  if (error || !data.ok) return toast('ผิดพลาด: ' + (data?.error || error?.message));
  const c = data.card;
  toast(`✨ ได้ ${c.emoji} ${c.name} (พลัง ${c.power})`);
  await refresh();
};

// Selection
function toggleSelect(id) {
  const card = inventoryEl.querySelector(`.card[data-id="${id}"]`);
  if (!card) return;
  if (selectedIds.has(id)) { selectedIds.delete(id); card.classList.remove('selected'); } 
  else { selectedIds.add(id); card.classList.add('selected'); }
  updateBadges(); updateSelectBar();
}

window.clearSelection = () => {
  if (selectedIds.size === 0) return;
  selectedIds.clear();
  inventoryEl.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
  updateSelectBar();
};

function updateBadges() {
  let n = 1;
  for (const id of selectedIds) {
    const card = inventoryEl.querySelector(`.card[data-id="${id}"]`);
    if (card) card.querySelector('.badge').textContent = n++;
  }
}

function updateSelectBar() {
  const n = selectedIds.size;
  const bar = document.getElementById('selectBar');
  const info = document.getElementById('selInfo');
  const btn = document.getElementById('redeemBtn');
  if (n === 0) { bar.classList.remove('show'); return; }
  bar.classList.add('show');
  const usable = Math.floor(n / CARDS_PER_SAUSAGE) * CARDS_PER_SAUSAGE;
  const leftover = n - usable;
  const rewards = usable / CARDS_PER_SAUSAGE;
  if (n < CARDS_PER_SAUSAGE) info.innerHTML = `เลือกแล้ว <b>${n}/${CARDS_PER_SAUSAGE}</b> ใบ`;
  else if (leftover === 0) info.innerHTML = `ใช้ <b>${usable}</b> ใบ → ได้ ${rewards} คูปอง`;
  else info.innerHTML = `ใช้ <b>${usable}</b> ใบ → ${rewards} คูปอง <span style="color:#999">(เหลือ ${leftover} ไม่ใช้)</span>`;
  btn.disabled = n < CARDS_PER_SAUSAGE;
}

inventoryEl.addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (card) toggleSelect(Number(card.dataset.id));
});

window.redeemCards = async () => {
  const n = selectedIds.size;
  if (n < CARDS_PER_SAUSAGE) return toast(`ต้องเลือกการ์ดอย่างน้อย ${CARDS_PER_SAUSAGE} ใบ`);
  const all = [...selectedIds];
  const usable = Math.floor(n / CARDS_PER_SAUSAGE) * CARDS_PER_SAUSAGE;
  const toRedeem = all.slice(0, usable);
  if (!confirm(`แลก ${usable} ใบ รับ ${usable / CARDS_PER_SAUSAGE} คูปอง?`)) return;
  const btn = document.getElementById('redeemBtn');
  btn.disabled = true;
  const { data, error } = await sb.rpc('rpc_create_redemption', { p_phone: me.phone, p_pin: pin, p_card_ids: toRedeem });
  if (error || !data.ok) { btn.disabled = false; return toast('ผิดพลาด: ' + (data?.error || error?.message)); }
  selectedIds.clear();
  await refresh();
  toast('✅ ได้คูปองแล้ว ดูที่ช่อง "คูปอง"');
};

async function refresh() {
  const { data } = await sb.rpc('rpc_get_customer', { p_phone: me.phone, p_pin: pin });
  me = data; collection = null; render();
  if (document.getElementById('tab-col').classList.contains('active')) loadCollection();
}

async function loadCollection() {
  collectionEl.innerHTML = '<p class="empty">กำลังโหลด...</p>';
  const { data, error } = await sb.rpc('rpc_get_collection', { p_phone: me.phone, p_pin: pin });
  if (error || !data.ok) { collectionEl.innerHTML = '<p class="empty">โหลดไม่สำเร็จ</p>'; return; }
  collection = data.sets; renderCollection();
}

function cardHTML(i, isSel, badgeNum) {
  return `<div class="card rarity-${i.rarity}${isSel ? ' selected' : ''}" data-id="${i.inventory_id}">
    <div class="art"><span class="emoji">${i.emoji}</span></div>
    <div class="meta"><div class="name">${escapeHtml(i.name)}</div><div class="power">⚡ ${i.power}</div></div>
    <div class="badge">${isSel ? badgeNum : ''}</div>
  </div>`;
}

function renderCoupons(cps) {
  const cpCountEl = document.getElementById('cpCount');
  const couponsEl = document.getElementById('coupons');
  cpCountEl.textContent = cps.length;
  if (cps.length === 0) { couponsEl.innerHTML = '<p class="coupons-empty">ยังไม่มีคูปองที่ยังไม่ได้ใช้</p>'; return; }
  couponsEl.innerHTML = cps.map(k => {
    const countText = k.label ? `<div class="label">${escapeHtml(k.label)}</div>` : `<div class="count">🍡 ลูกชิ้น <b>${k.cards / CARDS_PER_SAUSAGE}</b> ไม้</div>`;
    return `<div class="coupon">${countText}<div class="code">${escapeHtml(k.code)}</div><div class="meta">แสดงโค้ดนี้ที่ร้าน · ${new Date(k.created_at).toLocaleDateString('th-TH')}</div></div>`;
  }).join('');
}

function renderCollection() {
  if (!collection || collection.length === 0) { collectionEl.innerHTML = '<p class="empty">ยังไม่มีข้อมูลชุด</p>'; return; }
  collectionEl.innerHTML = collection.map(set => {
    const pct = set.total > 0 ? Math.round((set.owned / set.total) * 100) : 0;
    const isComplete = set.owned >= set.total;
    const cls = set.is_ultimate ? 'ultimate' : (isComplete ? 'complete' : '');
    let cardsHTML = '';
    if (!set.is_ultimate) {
      cardsHTML = '<div class="set-cards">' + set.cards.map(c => {
    if (!c.ever_owned) return `<div class="set-card-mini missing rarity-${c.rarity}">?</div>`;
        const used = c.count === 0;
        const badge = c.count > 0 ? `<span class="count-badge">×${c.count}</span>` : '';
        const usedMark = used ? `<span class="used-mark">✓</span>` : '';
        return `<div class="set-card-mini owned rarity-${c.rarity}"><span style="${used ? 'opacity:.4' : ''}">${c.emoji}</span>${badge}${usedMark}</div>`;
      }).join('') + '</div>';
    }
    let actionHTML;
    if (set.claimed) {
      const dt = set.claimed_at ? new Date(set.claimed_at).toLocaleDateString('th-TH') : '';
      actionHTML = `<div class="set-reward claimed">✅ รับรางวัลแล้ว ${dt}</div><button class="set-action-btn claimed" disabled>✅ รับแล้ว</button>`;
    } else if (isComplete) {
      actionHTML = `<div class="set-reward">🎁 ${escapeHtml(set.reward_text)}</div><button class="set-action-btn claim" onclick="claimSet('${set.code}')">✨ รับรางวัล!</button>`;
    } else {
      actionHTML = `<div class="set-reward">🎁 ${escapeHtml(set.reward_text)}</div><button class="set-action-btn claimed" disabled>ยังไม่ครบ</button>`;
    }
    return `<div class="set-card ${cls}">
      <div class="set-header"><div class="set-title">${set.emoji} ${escapeHtml(set.name)}${isComplete ? ' ⭐' : ''}</div><div class="set-progress-text">${set.owned}/${set.total}</div></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      ${cardsHTML}${actionHTML}
    </div>`;
  }).join('');
}

window.claimSet = async (code) => {
  if (!confirm('ยืนยันรับรางวัลชุดนี้?')) return;
  const { data, error } = await sb.rpc('rpc_claim_set_reward', { p_phone: me.phone, p_pin: pin, p_set_code: code });
  if (error || !data.ok) {
    const map = { already_claimed: 'ชุดนี้รับรางวัลไปแล้ว', not_complete: 'ยังเก็บไม่ครบ', set_not_found: 'ไม่พบชุดนี้', auth: 'เซสชันหมดอายุ' };
    return toast(map[data?.error] || 'ผิดพลาด: ' + (data?.error || error?.message));
  }
  toast(`🎉 ได้รับรางวัล! โค้ด: ${data.coupon.code}`);
  await refresh();
};

// Reroll
function getDupeGroups() {
  const groups = {};
  for (const i of me.inventory) {
    if (!groups[i.card_id]) groups[i.card_id] = [];
    groups[i.card_id].push(i);
  }
  const dupes = [];
  for (const cardId in groups) {
    const items = groups[cardId];
    if (items.length >= 2) dupes.push({ card: items[0], count: items.length, items });
  }
  return dupes;
}

function updateRerollFab() {
  const fab = document.getElementById('rerollFab');
  const onColTab = document.getElementById('tab-col').classList.contains('active');
  const dupes = me ? getDupeGroups() : [];
  if (onColTab && dupes.length > 0) fab.classList.add('show'); else fab.classList.remove('show');
}

window.openRerollModal = () => {
  const dupes = getDupeGroups();
  if (dupes.length === 0) return toast('ไม่มีการ์ดซ้ำให้ reroll');
  selectedReroll = null;
  const list = document.getElementById('rerollList');
  list.innerHTML = dupes.map(d => {
    const c = d.card;
    return `<div class="reroll-item rarity-${c.rarity}" data-card-id="${c.card_id}" data-inv-id="${c.inventory_id}">
      <span class="emoji">${c.emoji}</span><span class="name">${escapeHtml(c.name)}</span><span class="count-badge">×${d.count}</span>
    </div>`;
  }).join('');
  list.querySelectorAll('.reroll-item').forEach(el => {
    el.addEventListener('click', () => {
      list.querySelectorAll('.reroll-item').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
      selectedReroll = Number(el.dataset.invId);
      document.getElementById('rerollConfirm').disabled = false;
    });
  });
  document.getElementById('rerollConfirm').disabled = true;
  document.getElementById('rerollModal').classList.add('show');
};

window.closeRerollModal = () => { document.getElementById('rerollModal').classList.remove('show'); };

window.doReroll = async () => {
  if (!selectedReroll) return;
  const btn = document.getElementById('rerollConfirm');
  btn.disabled = true;
  const { data, error } = await sb.rpc('rpc_reroll_dupe', { p_phone: me.phone, p_pin: pin, p_inventory_id: selectedReroll });
  if (error || !data.ok) {
    const errMap = { not_duplicate: 'การ์ดนี้ไม่ซ้ำ', cooldown: 'ติดคูลดาวน์ 6 ชม.', daily_limit: 'ใช้ครบ 4 ครั้ง/วันแล้ว', not_found: 'ไม่พบการ์ดนี้', auth: 'เซสชันหมดอายุ' };
    toast(errMap[data?.error] || 'ผิดพลาด: ' + (data?.error || error?.message));
    btn.disabled = false; return;
  }
  const c = data.card;
  toast(`🔀 ได้ ${c.emoji} ${c.name} (${c.rarity})`);
  closeRerollModal(); await refresh();
  if (document.getElementById('tab-col').classList.contains('active')) loadCollection();
};

// Main Render
function render() {
  document.getElementById('login').style.display = me ? 'none' : 'block';
  document.getElementById('main').style.display = me ? 'block' : 'none';
  if (!me) return;
  document.getElementById('points').textContent = me.points;
  document.getElementById('invCount').textContent = me.inventory.length;
  const openBtn = document.getElementById('openBtn');
  openBtn.textContent = `🎴 เปิดการ์ด (${POINTS_PER_PACK} แต้ม)`;
  openBtn.disabled = me.points < POINTS_PER_PACK;

  const validIds = new Set(me.inventory.map(i => i.inventory_id));
  for (const id of [...selectedIds]) if (!validIds.has(id)) selectedIds.delete(id);

  const sorted = [...me.inventory].sort((a, b) => {
    const nc = a.name.localeCompare(b.name, 'th');
    if (nc !== 0) return nc;
    return (b.power || 0) - (a.power || 0);
  });

  if (sorted.length === 0) inventoryEl.innerHTML = '<p class="empty">ยังไม่มีการ์ด ไปซื้อลูกชิ้นก่อน!</p>';
  else {
    const selIdx = new Map(); let n = 1;
    for (const id of selectedIds) selIdx.set(id, n++);
    inventoryEl.innerHTML = sorted.map(i => {
      const idx = selIdx.get(i.inventory_id);
      return cardHTML(i, idx !== undefined, idx);
    }).join('');
  }
  renderCoupons(me.coupons || []);
  updateSelectBar(); updateRerollFab();
}

// Auto-login
const saved = localStorage.getItem('phone');
if (saved) {
  document.getElementById('phone').value = saved;
  document.getElementById('pin').value = localStorage.getItem('pin') || '';
  login();
}
</script>
